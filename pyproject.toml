[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-agent"
version = "0.1.0"
description = "AI Agent for PCB design: natural language to a KiCad 8 schematic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.30"]
graph = ["langgraph>=0.2"]
dev = ["pytest>=7.4"]

[project.scripts]
pcb-agent = "pcb_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcb_agent = ["../../data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
